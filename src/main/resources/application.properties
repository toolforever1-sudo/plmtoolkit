# =====================================================================
#  PLM Toolkit — bundled defaults (lives inside the JAR)
#
#  PHILOSOPHY (hybrid config, see /docs/config.md if it exists):
#    * Operational tunables and constants live HERE.
#    * Environment-specific values (DB creds, LDAP, hostnames, secrets,
#      server-specific paths) live in the EXTERNAL config file passed via
#      --spring.config.additional-location=...
#    * Spring Boot loads this file first, then overrides anything the
#      external file specifies — so you only put env-specific values in
#      the external file. Don't mirror tunables there or they'll drift
#      from the JAR (we just had this exact bug with multipart limits).
# =====================================================================

