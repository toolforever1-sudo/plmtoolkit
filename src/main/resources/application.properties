# File upload limits — the multipart limits saga from earlier today.
# These are bundled here ON PURPOSE so an external file can never silently
# enforce a smaller value than the code expects.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Session timeout (Tomcat default is 30 m which Vikas Singh reported in PT-33 as
# kicking him out during active usage — the front-end has periods of pure reading
# with no API traffic). Set to 2 h server-side ceiling; the front-end also pings
# /api/auth/session every 5 min while the tab is visible to keep an actively-used
# session warm. A hidden background tab will eventually time out by design.
server.servlet.session.timeout=2h

# PT-85 (Jimmy Sessumes, 2026-06-11): bump Tomcat's HTTP request header buffer
# from the 8KB default to 64KB. Jimmy uploaded a 404-part JV PN List, hit
# "Export Excel" / "Email Me" on the Part Extract tab, and both calls bounced
# at the HTTP layer with `IllegalArgumentException: Request header is too large`
# before any controller code ran (parts.js was packing the whole comma-joined
# list into a query string). PT-85's main fix is to move the payload to a JSON
# request body — this bump is the belt-and-suspenders so the legacy GET
# variants (and any external callers we don't control) keep working up to
# ~2,500 parts before they need the POST variant too.
server.max-http-header-size=64KB

