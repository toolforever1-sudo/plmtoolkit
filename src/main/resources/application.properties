# -----------------------------------------------------------------------
# IMS Review — Agile write-back (Phase 4)
# See docs/superpowers/specs/2026-05-20-ims-review-agile-writeback.md
#
# app.ims-review.writeback-enabled
#     Kill-switch for the whole cascade. When false (the default while we
#     iterate on dry runs), the toolkit ships the email + PDF flow only —
#     no DCO is created, no DRR History is written, no status push.
#     Flip to true env-by-env once a dry-run passes.
#
# app.ims-review.writeback-timeout-ms
#     HTTP timeout for calls into plm-agile-service. 120s — the DCO-create and
#     Restart-ECN endpoints open a per-user Agile PX session whose creation can
#     COLD-START to ~90s after an idle gap (observed on QA 2026-07-01: a
#     create-restart-ecn took 89s, ~87s of it in the PX login, after a 13-min
#     idle). 60s abandoned the call client-side and orphaned the created ECN;
#     120s lets the slow-but-successful call finish. The dialog shows live
#     progress dots during the wait.
# -----------------------------------------------------------------------
app.ims-review.writeback-enabled=false
app.ims-review.writeback-timeout-ms=120000
# DRR workflow status the toolkit pushes to on DM Approve (DCC drives from
# there to Implemented manually). In our env this is "CCB".
app.ims-review.drr-review-status=CCB

# IMS Review DCO form (Phase 5 — see docs/superpowers/specs/2026-05-28-ims-review-do-dco-form-design.md)
# Independent of writeback-enabled. When false, the DO "Needs Change — Upload"
# action falls back to the existing inline file+notes UI (Phase 1 behavior).
# Vikas flips to true after deploying the plm-agile-service Phase-5 jar and
# confirming the dry-run #3 logs show the cell IDs to pin in plm-agile-service.
app.ims-review.dco-form-enabled=false

# Per CRD ECN-129414:
#   "Cc: IMS-Doc-Managers-Agile@sandisk.com" on every DO notification, and
#   "Ensure DCC is copied on all these notifications."
# Both DLs are Cc'd on every DO/DM email (de-duped if they resolve to the
# same address). Override env-by-env once the real DLs are provisioned in LDAP.
app.ims-review.managers-dl=pdl-plm-admin@sandisk.com
app.ims-review.dcc-dl=pdl-plm-admin@sandisk.com
# Cc'd on EVERY IMS review-flow email (DO/DM/DCC/stakeholder/reassign),
# in addition to the DLs above. Comma-separated; blank to disable.
app.ims-review.always-cc=IMS-DCC-Agile@sandisk.com

# Document styles that never require a DRR (mirrors DocumentReview.java). A dash-
# board row whose Document Style contains any of these (case/space-insensitive)
# shows "No DRR required" instead of the Send New DRR button. Comma-separated.
app.ims-review.drr-exempt-styles=Specs,Drawing,Record - for dead document - buy off report

# Self-study training material (Bibi's SharePoint deck) linked from the DCO form
